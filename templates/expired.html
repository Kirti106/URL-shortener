<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Link Expired | Linkly</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="auth-page">

    <div class="auth-wrapper">

        <a href="{{ url_for('home') }}" class="brand auth-brand">
            <span class="brand-icon">↗</span>
            <span>Linkly<span class="brand-dot">.</span></span>
        </a>

        <div class="auth-card">

            <div class="auth-icon">⌛</div>

            <p class="auth-eyebrow">LINK UNAVAILABLE</p>

            <h1>This link has expired.</h1>

            <p class="auth-description">
                Sorry! The shortened URL you're trying to access
                is no longer active.
            </p>

            <a href="{{ url_for('home') }}" class="auth-submit">
                Go to Homepage ↗
            </a>

        </div>

        <p class="auth-footer">
            Linkly © 2026 · Make every link count.
        </p>

    </div>

</body>
</html>
