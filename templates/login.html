<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Linkly</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="auth-page">

    <div class="auth-wrapper">

        <a href="{{ url_for('home') }}" class="brand auth-brand">
            <span class="brand-icon">↗</span>
            <span>Linkly<span class="brand-dot">.</span></span>
        </a>

        <div class="auth-card">

            <div class="auth-icon">↗</div>

            <p class="auth-eyebrow">WELCOME BACK</p>

            <h1>Good to see you again.</h1>

            <p class="auth-description">
                Login to manage your links and track their performance.
            </p>

            {% if error %}
                <p class="error" role="alert">{{ error }}</p>
            {% endif %}

            <form method="POST" class="auth-form">

                <label for="email">Email address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <button type="submit" class="auth-submit">
                    Login to Linkly <span>↗</span>
                </button>

            </form>

            <div class="auth-divider"></div>

            <p class="auth-switch">
                Don't have an account?
                <a href="{{ url_for('register') }}">Create one</a>
            </p>

        </div>

        <p class="auth-footer">
            Linkly © 2026 · Make every link count.
        </p>

    </div>

</body>
</html>
